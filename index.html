    function atribuirNota(idAvaliado, valorStr) { 
      if (!valorStr) return; 
      if (!window.votacaoLiberada) { alert("A votação está bloqueada!"); return; }
      if (perfilAtual === 'visitante') { alert("Perfil Visitante apenas visualiza."); return; }
      if (!usuarioAutenticadoId) { alert("Autentique-se primeiro."); return; }

      if (typeof usuarioAutenticadoId === 'number' && idAvaliado === usuarioAutenticadoId) {
        alert("Você não pode votar em si mesmo!");
        window.atualizarInterfaceGeral();
        return;
      }

      const valor = parseFloat(valorStr);
      const j = window.jogadores.find(item => item.id === idAvaliado); 
      
      if (j && !j.excluido) { 
        if (!j.avaliacoesRecebidas) j.avaliacoesRecebidas = []; 
        const jaVotou = j.avaliacoesRecebidas.some(v => v.votanteId === usuarioAutenticadoId);
        if (jaVotou) { alert("Você já votou neste atleta!"); return; }

        j.avaliacoesRecebidas.push({ votanteId: usuarioAutenticadoId, nota: valor }); 

        const soma = j.avaliacoesRecebidas.reduce((acc, curr) => acc + curr.nota, 0);
        j.nota = soma / j.avaliacoesRecebidas.length;

        if(window.salvarDadosNuvem) window.salvarDadosNuvem(); 
        registrarLog(`Atleta '${j.apelido}' recebeu nota ${valor.toFixed(1)}`);
        alert(`Voto registrado!`);
        window.atualizarInterfaceGeral();
      } 
    }

    function contabilizarAcaoPartidaAtual(idAtleta, tipoCampo) {
      if (!window.statsPartidaAtual) window.statsPartidaAtual = {};
      if (!window.statsPartidaAtual[idAtleta]) {
        window.statsPartidaAtual[idAtleta] = { gols: 0, assistencias: 0, defesasLinha: 0, defesasPenalti: 0, finalizacoesFora: 0 };
      }
      window.statsPartidaAtual[idAtleta][tipoCampo] = (window.statsPartidaAtual[idAtleta][tipoCampo] || 0) + 1;
    }

    function descontarAcaoPartidaAtual(idAtleta, tipoCampo) {
      if (window.statsPartidaAtual && window.statsPartidaAtual[idAtleta] && window.statsPartidaAtual[idAtleta][tipoCampo]) {
        window.statsPartidaAtual[idAtleta][tipoCampo] = Math.max(0, window.statsPartidaAtual[idAtleta][tipoCampo] - 1);
      }
    }

    function registrarGolFeito() {
      if (!jogadorSelecionado || (perfilAtual !== 'dono' && perfilAtual !== 'admin')) return;
      tocarSomGol(); const autor = window.jogadores.find(j => j.id === jogadorSelecionado.id);
      if (autor && !autor.excluido) { 
        if(!autor.stats) autor.stats = { ...statsPadrao }; 
        autor.stats.gols = (autor.stats.gols || 0) + 1; 
        contabilizarAcaoPartidaAtual(autor.id, 'gols');
      }
      if (jogadorSelecionado.time === 'A') window.placar.a++; else window.placar.b++;
      
      const acaoObj = { id: Date.now(), tipo: 'gol', atletaId: autor ? autor.id : null, time: jogadorSelecionado.time };
      eventosJogoAtual.push({ autor: autor ? autor.apelido : 'Atleta', assistencia: null });
      window.historicoAcoesPartida.push(acaoObj);

      if(window.salvarDadosNuvem) window.salvarDadosNuvem(); fecharModalAcao(); window.atualizarInterfaceGeral();
    }

    function registrarAssistenciaComGol() {
      if (!jogadorSelecionado || (perfilAtual !== 'dono' && perfilAtual !== 'admin')) return;
      const passador = window.jogadores.find(j => j.id === jogadorSelecionado.id);
      if (!passador || passador.excluido) return;

      const timeKey = jogadorSelecionado.time === 'A' ? timeAAtual : timeBAtual;
      const timeAtletas = window.timesGlobais[timeKey] || [];
      const colegasEmCampo = timeAtletas.filter(a => {
        const jReal = window.jogadores.find(j => j.id === a.id) || a;
        return jReal.id !== passador.id && !jReal.excluido && jReal.statusPresenca !== 'reserva' && jReal.statusPresenca !== 'ausente';
      });

      if (colegasEmCampo.length === 0) {
        alert("Nenhum colega em campo encontrado para finalizar!");
        return;
      }

      document.getElementById('label-passador-assistencia').innerText = `Passe de: ${passador.apelido}`;
      const containerLista = document.getElementById('lista-autores-gol');
      containerLista.innerHTML = '';

      colegasEmCampo.forEach(colega => {
        const jReal = window.jogadores.find(j => j.id === colega.id) || colega;
        const btn = document.createElement('button');
        btn.className = "w-full bg-slate-900 hover:bg-slate-950 text-emerald-400 font-bold p-2 rounded-xl text-xs text-left border border-indigo-500/30 flex items-center justify-between";
        btn.innerHTML = `<span>⚽ ${jReal.apelido}</span> <span class="text-[10px] text-slate-400">(${jReal.posicaoEfetivaJogo || jReal.posicao})</span>`;
        btn.onclick = () => confirmarGolComAssistencia(passador, jReal);
        containerLista.appendChild(btn);
      });

      fecharModalAcao();
      document.getElementById('modal-autor-gol').classList.remove('hidden');
    }

    function fecharModalAutorGol() {
      document.getElementById('modal-autor-gol').classList.add('hidden');
    }

    function confirmarGolComAssistencia(passador, autorGol) {
      fecharModalAutorGol();
      tocarSomGol();

      if (!passador.stats) passador.stats = { ...statsPadrao };
      passador.stats.assistencias = (passador.stats.assistencias || 0) + 1;
      contabilizarAcaoPartidaAtual(passador.id, 'assistencias');

      if (!autorGol.stats) autorGol.stats = { ...statsPadrao };
      autorGol.stats.gols = (autorGol.stats.gols || 0) + 1;
      contabilizarAcaoPartidaAtual(autorGol.id, 'gols');

      if (jogadorSelecionado.time === 'A') window.placar.a++; else window.placar.b++;

      eventosJogoAtual.push({ autor: autorGol.apelido, assistencia: passador.apelido });
      window.historicoAcoesPartida.push({
        id: Date.now(),
        tipo: 'assistencia_com_gol',
        passadorId: passador.id,
        autorId: autorGol.id,
        time: jogadorSelecionado.time
      });

      if (window.salvarDadosNuvem) window.salvarDadosNuvem();
      registrarLog(`Gol de ${autorGol.apelido} com assistência de ${passador.apelido}.`);
      window.atualizarInterfaceGeral();
    }

    function registrarDefesaLinha() {
      if (!jogadorSelecionado || (perfilAtual !== 'dono' && perfilAtual !== 'admin')) return;
      tocarSomTafarel();
      const j = window.jogadores.find(x => x.id === jogadorSelecionado.id);
      if (j && !j.excluido) {
        if (!j.stats) j.stats = { ...statsPadrao };
        j.stats.defesasLinha = (j.stats.defesasLinha || 0) + 1;
        contabilizarAcaoPartidaAtual(j.id, 'defesasLinha');
        window.historicoAcoesPartida.push({ id: Date.now(), tipo: 'defesaLinha', atletaId: j.id });
        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
        registrarLog(`Defesa na linha por '${j.apelido}' (+1.5 pt).`);
      }
      fecharModalAcao();
      window.atualizarInterfaceGeral();
    }

    function registrarDefesaPenalti() {
      if (!jogadorSelecionado || (perfilAtual !== 'dono' && perfilAtual !== 'admin')) return;
      tocarSomTafarel();
      const j = window.jogadores.find(x => x.id === jogadorSelecionado.id);
      if (j && !j.excluido) {
        if (!j.stats) j.stats = { ...statsPadrao };
        j.stats.defesasPenalti = (j.stats.defesasPenalti || 0) + 1;
        contabilizarAcaoPartidaAtual(j.id, 'defesasPenalti');
        window.historicoAcoesPartida.push({ id: Date.now(), tipo: 'defesaPenalti', atletaId: j.id });
        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
        registrarLog(`Pênalti defendido por '${j.apelido}' (+3.0 pts).`);
      }
      fecharModalAcao();
      window.atualizarInterfaceGeral();
    }

    function registrarFinalizacaoFora() {
      if (!jogadorSelecionado || (perfilAtual !== 'dono' && perfilAtual !== 'admin')) return;
      tocarSomGolPerdido();
      const j = window.jogadores.find(x => x.id === jogadorSelecionado.id);
      if (j && !j.excluido) {
        if (!j.stats) j.stats = { ...statsPadrao };
        j.stats.finalizacoesFora = (j.stats.finalizacoesFora || 0) + 1;
        contabilizarAcaoPartidaAtual(j.id, 'finalizacoesFora');
        window.historicoAcoesPartida.push({ id: Date.now(), tipo: 'finalizacaoFora', atletaId: j.id });
        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
        registrarLog(`Finalização bizarra para fora por '${j.apelido}' (-0.5 pt).`);
      }
      fecharModalAcao();
      window.atualizarInterfaceGeral();
    }

    function retificarUltimaAcaoPartida() {
      if (perfilAtual !== 'dono' && perfilAtual !== 'admin') { alert("Apenas Administradores podem desfazer ações."); return; }
      if (!window.historicoAcoesPartida || window.historicoAcoesPartida.length === 0) {
        alert("Nenhuma ação registrada para desfazer.");
        return;
      }

      const ultimaAcao = window.historicoAcoesPartida.pop();

      if (ultimaAcao.tipo === 'gol') {
        const j = window.jogadores.find(x => x.id === ultimaAcao.atletaId);
        if (j && j.stats && j.stats.gols > 0) {
          j.stats.gols--;
          descontarAcaoPartidaAtual(j.id, 'gols');
        }
        if (ultimaAcao.time === 'A') window.placar.a = Math.max(0, window.placar.a - 1);
        else window.placar.b = Math.max(0, window.placar.b - 1);
        eventosJogoAtual.pop();
        registrarLog(`Desfeita última ação: Gol retificado.`);
      } else if (ultimaAcao.tipo === 'assistencia_com_gol') {
        const pass = window.jogadores.find(x => x.id === ultimaAcao.passadorId);
        const aut = window.jogadores.find(x => x.id === ultimaAcao.autorId);

        if (pass && pass.stats && pass.stats.assistencias > 0) {
          pass.stats.assistencias--;
          descontarAcaoPartidaAtual(pass.id, 'assistencias');
        }
        if (aut && aut.stats && aut.stats.gols > 0) {
          aut.stats.gols--;
          descontarAcaoPartidaAtual(aut.id, 'gols');
        }

        if (ultimaAcao.time === 'A') window.placar.a = Math.max(0, window.placar.a - 1);
        else window.placar.b = Math.max(0, window.placar.b - 1);
        eventosJogoAtual.pop();
        registrarLog(`Desfeita última ação: Gol e Assistência retificados.`);
      } else if (ultimaAcao.tipo === 'defesaLinha') {
        const j = window.jogadores.find(x => x.id === ultimaAcao.atletaId);
        if (j && j.stats && j.stats.defesasLinha > 0) {
          j.stats.defesasLinha--;
          descontarAcaoPartidaAtual(j.id, 'defesasLinha');
        }
        registrarLog(`Desfeita última ação: Defesa de linha retificada.`);
      } else if (ultimaAcao.tipo === 'defesaPenalti') {
        const j = window.jogadores.find(x => x.id === ultimaAcao.atletaId);
        if (j && j.stats && j.stats.defesasPenalti > 0) {
          j.stats.defesasPenalti--;
          descontarAcaoPartidaAtual(j.id, 'defesasPenalti');
        }
        registrarLog(`Desfeita última ação: Defesa de pênalti retificada.`);
      } else if (ultimaAcao.tipo === 'finalizacaoFora') {
        const j = window.jogadores.find(x => x.id === ultimaAcao.atletaId);
        if (j && j.stats && j.stats.finalizacoesFora > 0) {
          j.stats.finalizacoesFora--;
          descontarAcaoPartidaAtual(j.id, 'finalizacoesFora');
        }
        registrarLog(`Desfeita última ação: Erro para fora retificado.`);
      }

      if (window.salvarDadosNuvem) window.salvarDadosNuvem();
      window.atualizarInterfaceGeral();
      alert("Última ação desfeita com sucesso!");
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      switchTab('campo');
    });
  </script>
</body>
