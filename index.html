<script type="module">

    import { getFirestore, doc, setDoc, runTransaction, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC9MsTuuSh8G28JEtZUwuPWJpkV92UM7mI",
      authDomain: "futeba-de-primeira.firebaseapp.com",
      projectId: "futeba-de-primeira",
      storageBucket: "futeba-de-primeira.firebasestorage.app",
      messagingSenderId: "1065315341730",
      appId: "1:1065315341730:web:cf71c7400606432c844efb",
      measurementId: "G-D7L57N5PDL"
    };

    enableIndexedDbPersistence(db).catch(() => {});

    // ============================================================
    // SINCRONIZAÇÃO MULTIDISPOSITIVO / CONTROLE DE CONCORRÊNCIA
    // ============================================================
    // Antes, cada gravação fazia setDoc() com o estado inteiro que
    // estava no aparelho. Dois celulares gravando ao mesmo tempo
    // poderiam sobrescrever alterações um do outro.
    // Agora usamos transação + estado-base sincronizado para:
    // 1) descobrir o que realmente mudou neste aparelho;
    // 2) ler a versão mais recente do Firestore dentro da transação;
    // 3) mesclar somente as alterações locais;
    // 4) preservar alterações feitas por outro celular em paralelo.
    const CAMPOS_ESTADO = [
      'jogadores','solicitacoes','solicitacoesExclusao','timesGlobais','placar',
      'temporadaInfo','historicoTemporadas','historicoMensal','historicoJogosDia',
      'mesAnoAtivo','logsAuditoria','votacaoLiberada','esquemaTaticoTimeA',
      'esquemaTaticoTimeB','esquemaTaticoTimeC','caixinhaFinanceira','despesasQuadra',
      'idCraqueRodada','historicoAcoesPartida','historicoCaixinhaMensal','infoTimePersonalizado','senhaDono',
      'senhaAdmin','respostaSegurancaDono'
    ];

    let estadoSincronizadoBase = null;
    let sincronizacaoInicialConcluida = false;
    let salvamentoEmAndamento = false;
    let filaSalvamento = false;

    function clonarSeguro(valor) {
      if (valor === undefined) return undefined;
      try { return JSON.parse(JSON.stringify(valor)); } catch (e) { return valor; }
    }

    function obterEstadoAtual() {
      return {
        jogadores: window.jogadores || [],
        solicitacoes: window.solicitacoesPendentes || [],
        solicitacoesExclusao: window.solicitacoesExclusao || [],
        timesGlobais: window.timesGlobais || { A: [], B: [], C: [] },
        placar: window.placar || { a: 0, b: 0 },
        temporadaInfo: window.temporadaInfo || { numero: 1, ativa: true },
        historicoTemporadas: window.historicoTemporadas || [],
        historicoMensal: window.historicoMensal || [],
        historicoJogosDia: window.historicoJogosDia || [],
        mesAnoAtivo: window.mesAnoAtivo || "",
        logsAuditoria: window.logsAuditoria || [],
        votacaoLiberada: typeof window.votacaoLiberada !== 'undefined' ? window.votacaoLiberada : false,
        esquemaTaticoTimeA: window.esquemaTaticoTimeA || 'auto',
        esquemaTaticoTimeB: window.esquemaTaticoTimeB || 'auto',
        esquemaTaticoTimeC: window.esquemaTaticoTimeC || 'auto',
        caixinhaFinanceira: window.caixinhaFinanceira || { valorMensalidade: 50, chavePix: "futeba@pix.com" },
        despesasQuadra: window.despesasQuadra || {},
        idCraqueRodada: window.idCraqueRodada || null,
        historicoAcoesPartida: window.historicoAcoesPartida || [],
        historicoCaixinhaMensal: window.historicoCaixinhaMensal || [],
        infoTimePersonalizado: window.infoTimePersonalizado || { nome: "Pelada dos Amigos", escudo: "" },
        senhaDono: window.SENHA_DONO || "Lique*",
        senhaAdmin: window.SENHA_ADMIN || "12345",
        respostaSegurancaDono: window.RESPOSTA_SEGURANCA_DONO || "futeba"
      };
    }

    function iguais(a, b) {
      try { return JSON.stringify(a) === JSON.stringify(b); } catch (e) { return a === b; }
    }

    function mesclarArrayPorId(local, base, remoto) {
      const L = Array.isArray(local) ? local : [];
      const B = Array.isArray(base) ? base : [];
      const R = Array.isArray(remoto) ? remoto : [];
      const temId = [...L, ...B, ...R].some(x => x && typeof x === 'object' && x.id !== undefined && x.id !== null);
      if (!temId) return null;

      const map = new Map();
      R.forEach(x => { if (x && x.id != null) map.set(String(x.id), clonarSeguro(x)); });
      const baseMap = new Map();
      B.forEach(x => { if (x && x.id != null) baseMap.set(String(x.id), x); });
      const localMap = new Map();
      L.forEach(x => { if (x && x.id != null) localMap.set(String(x.id), x); });

      // Alterações locais vencem somente quando o item foi realmente alterado.
      localMap.forEach((item, id) => {
        const b = baseMap.get(id);
        if (!b || !iguais(item, b)) map.set(id, clonarSeguro(item));
      });

      // Exclusões feitas localmente (quando o item existia na base e sumiu localmente).
      baseMap.forEach((b, id) => {
        if (!localMap.has(id) && !iguais(b, undefined)) map.delete(id);
      });

      // Itens novos do remoto e do local permanecem.
      const ordem = [];
      R.forEach(x => { if (x && x.id != null && !ordem.includes(String(x.id))) ordem.push(String(x.id)); });
      L.forEach(x => { if (x && x.id != null && !ordem.includes(String(x.id))) ordem.push(String(x.id)); });
      return ordem.map(id => map.get(id)).filter(Boolean);
    }

    function mesclarCampo(local, base, remoto, campo) {
      if (campo === 'jogadores') {
        const porId = mesclarArrayPorId(local, base, remoto);
        if (porId) return porId;
      }

      // Para históricos/logs/solicitações, quando os dois aparelhos adicionam
      // registros simultaneamente, preservamos os registros dos dois lados.
      if (Array.isArray(local) && Array.isArray(remoto) &&
          ['historicoTemporadas','historicoMensal','historicoJogosDia','logsAuditoria','historicoAcoesPartida','solicitacoes','solicitacoesExclusao'].includes(campo)) {
        const baseArr = Array.isArray(base) ? base : [];
        const localNovos = local.filter(x => !baseArr.some(b => iguais(b, x)));
        const remotoNovos = remoto.filter(x => !baseArr.some(b => iguais(b, x)));
        const resultado = [...remoto];
        remotoNovos.forEach(x => {
          if (!resultado.some(r => iguais(r, x))) resultado.push(clonarSeguro(x));
        });
        localNovos.forEach(x => {
          if (!resultado.some(r => iguais(r, x))) resultado.push(clonarSeguro(x));
        });
        return resultado;
      }

      // Objetos simples: se houve alteração local, ela é preservada.
      return clonarSeguro(local);
    }

    function mesclarEstados(local, base, remoto) {
      const resultado = clonarSeguro(remoto || {});
      CAMPOS_ESTADO.forEach(campo => {
        const l = local ? local[campo] : undefined;
        const b = base ? base[campo] : undefined;
        if (!iguais(l, b)) {
          resultado[campo] = mesclarCampo(l, b, remoto ? remoto[campo] : undefined, campo);
        } else if (remoto && Object.prototype.hasOwnProperty.call(remoto, campo)) {
          resultado[campo] = clonarSeguro(remoto[campo]);
        }
      });
      return resultado;
    }

    function aplicarEstadoNaInterface(data) {
      if (!data) return;
      if (data.jogadores) window.jogadores = data.jogadores;
      if (data.solicitacoes) window.solicitacoesPendentes = data.solicitacoes;
      if (data.solicitacoesExclusao) window.solicitacoesExclusao = data.solicitacoesExclusao;
      if (data.timesGlobais) window.timesGlobais = data.timesGlobais;
      if (data.placar) window.placar = data.placar;
      if (data.temporadaInfo) window.temporadaInfo = data.temporadaInfo;
      if (data.historicoTemporadas) window.historicoTemporadas = data.historicoTemporadas;
      if (data.historicoMensal) window.historicoMensal = data.historicoMensal;
      if (data.historicoJogosDia) window.historicoJogosDia = data.historicoJogosDia;
      if (data.mesAnoAtivo) window.mesAnoAtivo = data.mesAnoAtivo;
      if (data.logsAuditoria) window.logsAuditoria = data.logsAuditoria;
      if (typeof data.votacaoLiberada !== 'undefined') window.votacaoLiberada = data.votacaoLiberada;
      if (data.esquemaTaticoTimeA) window.esquemaTaticoTimeA = data.esquemaTaticoTimeA;
      if (data.esquemaTaticoTimeB) window.esquemaTaticoTimeB = data.esquemaTaticoTimeB;
      if (data.esquemaTaticoTimeC) window.esquemaTaticoTimeC = data.esquemaTaticoTimeC;
      if (data.caixinhaFinanceira) window.caixinhaFinanceira = data.caixinhaFinanceira;
      if (data.despesasQuadra) window.despesasQuadra = data.despesasQuadra;
      if (data.idCraqueRodada) window.idCraqueRodada = data.idCraqueRodada;
      if (data.historicoAcoesPartida) window.historicoAcoesPartida = data.historicoAcoesPartida;
        if (data.historicoCaixinhaMensal) window.historicoCaixinhaMensal = data.historicoCaixinhaMensal;
      if (data.infoTimePersonalizado) window.infoTimePersonalizado = data.infoTimePersonalizado;
      if (data.senhaDono) window.SENHA_DONO = data.senhaDono;
      if (data.senhaAdmin) window.SENHA_ADMIN = data.senhaAdmin;
      if (data.respostaSegurancaDono) window.RESPOSTA_SEGURANCA_DONO = data.respostaSegurancaDono;
    }

    onSnapshot(docRef, (docSnap) => {
      if (!docSnap.exists()) return;
      const remoto = docSnap.data();
      const local = obterEstadoAtual();

      if (!sincronizacaoInicialConcluida || !estadoSincronizadoBase) {
        aplicarEstadoNaInterface(remoto);
        estadoSincronizadoBase = clonarSeguro({ ...obterEstadoAtual(), ...remoto });
        sincronizacaoInicialConcluida = true;
      } else {
        // Se este aparelho tinha alterações locais ainda não consolidadas,
        // preserva-as enquanto incorpora as alterações do outro aparelho.
        const mesclado = mesclarEstados(local, estadoSincronizadoBase, remoto);
        aplicarEstadoNaInterface(mesclado);
        estadoSincronizadoBase = clonarSeguro(remoto);
      }

      if (window.verificarViradaDeMesAutomatica) window.verificarViradaDeMesAutomatica();
      if (window.atualizarInterfaceGeral) window.atualizarInterfaceGeral();
    });

    window.salvarDadosNuvem = async function() {
      if (salvamentoEmAndamento) { filaSalvamento = true; return; }
      salvamentoEmAndamento = true;
      try {
        const local = obterEstadoAtual();
        const base = estadoSincronizadoBase || {};

        await runTransaction(db, async (transaction) => {
          const snap = await transaction.get(docRef);
          const remoto = snap.exists() ? snap.data() : {};
          const mesclado = sincronizacaoInicialConcluida
            ? mesclarEstados(local, base, remoto)
            : local;
          transaction.set(docRef, mesclado, { merge: true });
          estadoSincronizadoBase = clonarSeguro(mesclado);
        });
      } catch (err) {
        console.error('Falha na sincronização segura:', err);
      } finally {
        salvamentoEmAndamento = false;
        if (filaSalvamento) {
          filaSalvamento = false;
          setTimeout(() => window.salvarDadosNuvem(), 50);
        }
      }
    };
  </script>


  <script>
    window.SENHA_DONO = window.SENHA_DONO || "Lique*";
    window.SENHA_ADMIN = window.SENHA_ADMIN || "12345";
    window.RESPOSTA_SEGURANCA_DONO = window.RESPOSTA_SEGURANCA_DONO || "futeba";

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function tocarSomGol() { if (audioCtx.state === 'suspended') audioCtx.resume(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 1.2); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 1.2); }
    function tocarSomGolPerdido() { if (audioCtx.state === 'suspended') audioCtx.resume(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.8); gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.8); }
    function tocarSomTafarel() { if (audioCtx.state === 'suspended') audioCtx.resume(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(900, audioCtx.currentTime + 0.9); gain.gain.setValueAtTime(0.4, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.0); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 1.0); }
    function tocarSomApito() { if (audioCtx.state === 'suspended') audioCtx.resume(); [0, 0.25].forEach(delay => { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(2800, audioCtx.currentTime + delay); gain.gain.setValueAtTime(0.2, audioCtx.currentTime + delay); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + delay + 0.2); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(audioCtx.currentTime + delay); osc.stop(audioCtx.currentTime + delay + 0.2); }); }

    let perfilAtual = 'visitante'; 
    let usuarioAutenticadoId = null; 
    let perfilDestinoPendente = null;
    let timerInterval = null; let timerTempo = 600; let tempoEncerrado = false;
    let apito1MinTocado = false;
    let viewRanking = 'mensal';
    let numeroPartidaAtual = 1;
    let escalacaoAjustadaEConfirmada = false;
    const statsPadrao = { 
      gols: 0, assistencias: 0, defesasLinha: 0, defesasPenalti: 0, finalizacoesFora: 0, 
      golsSofridos: 0, ausenciasNaoAvisadas: 0, atrasos: 0, pontosVitorias: 0, 
      cleanSheets: 0, muralhaSequencia: 0, bonusCraqueDia: 0, jogos: 0, presencaPrazo: true, mensalidadePaga: false, valorPagoMensalidade: 0 
    };
    
    window.temporadaInfo = window.temporadaInfo || { numero: 1, ativa: true };
    window.historicoTemporadas = window.historicoTemporadas || [];
    window.historicoMensal = window.historicoMensal || [];
    window.historicoJogosDia = window.historicoJogosDia || [];
    window.historicoAcoesPartida = window.historicoAcoesPartida || [];
    window.historicoCaixinhaMensal = window.historicoCaixinhaMensal || [];
    window.statsPartidaAtual = {};
    window.mesAnoAtivo = window.mesAnoAtivo || "";
    window.logsAuditoria = window.logsAuditoria || [];
    window.solicitacoesPendentes = window.solicitacoesPendentes || [];
    window.solicitacoesExclusao = window.solicitacoesExclusao || [];
    window.votacaoLiberada = typeof window.votacaoLiberada !== 'undefined' ? window.votacaoLiberada : false;
    
    window.esquemaTaticoTimeA = window.esquemaTaticoTimeA || 'auto';
    window.esquemaTaticoTimeB = window.esquemaTaticoTimeB || 'auto';
    window.esquemaTaticoTimeC = window.esquemaTaticoTimeC || 'auto';
    
    window.caixinhaFinanceira = window.caixinhaFinanceira || { valorMensalidade: 50, chavePix: "futeba@pix.com" };
    window.despesasQuadra = window.despesasQuadra || {};
    window.idCraqueRodada = window.idCraqueRodada || null;

    window.jogadores = window.jogadores || [];

    let timeAAtual = "A"; let timeBAtual = "B"; let timeEspera = "C";
    let jogosSeguidosTimeA = 0; let jogosSeguidosTimeB = 0;
    window.placar = window.placar || { a: 0, b: 0 }; let jogadorSelecionado = null;
    let eventosJogoAtual = [];
    let mudancaPosicaoPendente = null;
    let fotoBase64Recortada = '';

    function calcularIdadeAtleta(dataNasc) {
      if (!dataNasc) return 20;
      const hoje = new Date();
      const nasc = new Date(dataNasc);
      let idade = hoje.getFullYear() - nasc.getFullYear();
      const m = hoje.getMonth() - nasc.getMonth();
      if (m < 0 || (m === 0 && hoje.getDate() < nasc.getDate())) idade--;
      return idade;
    }

    function calcularFatorVeteranoAtleta(idade) {
      if (idade < 35) return 1.0;
      return 1.0 + ((idade - 34) * 0.02);
    }

    window.verificarViradaDeMesAutomatica = function() {
      const agora = new Date();
      const mesAnoHoje = `${(agora.getMonth() + 1).toString().padStart(2, '0')}/${agora.getFullYear()}`;

      if (!window.mesAnoAtivo) {
        window.mesAnoAtivo = mesAnoHoje;
        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
        return;
      }

      if (window.mesAnoAtivo !== mesAnoHoje) {
        const rankingFechado = window.jogadores.filter(j => !j.excluido).map(j => ({
          id: j.id,
          apelido: j.apelido,
          posicao: j.posicao,
          pontos: calcularPontos(j),
          nota: j.nota || 0,
          gols: (j.stats && j.stats.gols) || 0,
          assistencias: (j.stats && j.stats.assistencias) || 0
        })).sort((a,b) => b.pontos - a.pontos);

        const mesAnterior = window.mesAnoAtivo;
        const dataEncerramento = new Date().toLocaleDateString('pt-BR');

        window.historicoMensal = window.historicoMensal || [];
        window.historicoMensal = window.historicoMensal.filter(h => h.mesAno !== mesAnterior);
        window.historicoMensal.push({
          mesAno: mesAnterior,
          dataEncerramento,
          ranking: rankingFechado
        });

        arquivarCaixinhaMensal(mesAnterior, dataEncerramento);

        window.jogadores.forEach(j => {
          if (j.stats) { j.stats = { ...statsPadrao }; }
          j.nota = 0.0;
          j.avaliacoesRecebidas = [];
        });

        window.mesAnoAtivo = mesAnoHoje;
        window.idCraqueRodada = null;

        registrarLog(`VIRADA DE MÊS AUTOMÁTICA: o mês ${mesAnterior} foi fechado e o mês ${mesAnoHoje} foi aberto.`);
        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
      }
    };

    function calcularPontos(j) {
      if (!j.stats) j.stats = { ...statsPadrao };
      const s = j.stats;

      const ptsGols = (s.gols || 0) * 1.0;
      const ptsAssis = (s.assistencias || 0) * 0.5;
      const ptsDefLinha = (s.defesasLinha || 0) * 1.5;
      const ptsDefPenalti = (s.defesasPenalti || 0) * 3.0;
      const ptsVit = (s.pontosVitorias || 0);
      const ptsCleanSheet = (s.cleanSheets || 0) * 2.0;
      const ptsMuralha = (s.muralhaSequencia || 0) * 1.5;
      const ptsPresencaPrazo = s.presencaPrazo ? 1.0 : 0.0;
      const ptsCraque = (s.bonusCraqueDia || 0);

      const subFora = (s.finalizacoesFora || 0) * 0.5;
      const subAtrasos = (s.atrasos || 0) * 0.5;
      const subBoloSemAviso = (s.ausenciasNaoAvisadas || 0) * 5.0;

      const pos = j.posicaoEfetivaJogo || j.posicao;
      const subGolsSofridos = (pos === 'Goleiro') ? ((s.golsSofridos || 0) * 0.1) : (pos.includes('Zagueiro') || pos.includes('Lateral') ? ((s.golsSofridos || 0) * 0.5) : 0.0);

      const pontuacaoBase = (ptsGols + ptsAssis + ptsDefLinha + ptsDefPenalti + ptsVit + ptsCleanSheet + ptsMuralha + ptsPresencaPrazo + ptsCraque) 
                  - (subFora + subAtrasos + subBoloSemAviso + subGolsSofridos);

      const idade = calcularIdadeAtleta(j.nascimento);
      const fator = calcularFatorVeteranoAtleta(idade);

      return parseFloat((pontuacaoBase * fator).toFixed(1));
    }

    function elegerCraqueRodadaManual() {
      if (perfilAtual !== 'dono' && perfilAtual !== 'admin') return;

      const confirmados = window.jogadores.filter(j => !j.excluido && (j.statusPresenca === 'jogo' || j.statusPresenca === 'reserva'));
      if (confirmados.length === 0) { alert("Nenhum atleta ativo para eleger!"); return; }

      let melhorAtleta = null;
      let maiorPontuacao = -999;

      confirmados.forEach(j => {
        const pts = calcularPontos(j);
        if (pts > maiorPontuacao) {
          maiorPontuacao = pts;
          melhorAtleta = j;
        }
      });

      if (melhorAtleta) {
        const craqueAnteriorId = window.idCraqueRodada;
        if (craqueAnteriorId && craqueAnteriorId !== melhorAtleta.id) {
          const anterior = window.jogadores.find(j => j.id === craqueAnteriorId);
          if (anterior && anterior.stats) anterior.stats.bonusCraqueDia = Math.max(0, (anterior.stats.bonusCraqueDia || 0) - 2.0);
        }
        if (!melhorAtleta.stats) melhorAtleta.stats = { ...statsPadrao };
        if (craqueAnteriorId !== melhorAtleta.id) {
          melhorAtleta.stats.bonusCraqueDia = (melhorAtleta.stats.bonusCraqueDia || 0) + 2.0;
        }
        window.idCraqueRodada = melhorAtleta.id;
        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
        
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        registrarLog(`'${melhorAtleta.apelido}' foi eleito o ⭐ Craque do Dia (+2.0 pts)!`);
        alert(`👑 CRAQUE DO DIA ELEITO!\n\nAtleta: ${melhorAtleta.apelido}\nPontuação: ${maiorPontuacao.toFixed(1)} pts`);
        window.atualizarInterfaceGeral();
      }
    }

    function solicitarAlteracaoPosicaoJogoAtual(novaPos) {
      if (!jogadorSelecionado) return;
      const jSaindo = window.jogadores.find(item => item.id === jogadorSelecionado.id);
      if (!jSaindo || jSaindo.excluido) return;

      const timeKey = jogadorSelecionado.time === 'A' ? timeAAtual : timeBAtual;
      const timeAtletas = window.timesGlobais[timeKey] || [];

      let esquema = '2-2-1';
      if (timeKey === 'A') esquema = window.esquemaTaticoTimeA;
      else if (timeKey === 'B') esquema = window.esquemaTaticoTimeB;
      else esquema = window.esquemaTaticoTimeC;

      if (esquema === 'auto') { esquema = sugerirEsquemaTaticoAutomatico(timeAtletas.filter(x => x.statusPresenca !== 'reserva')); }

      let maxVagas = 1;
      if (novaPos === 'Goleiro') maxVagas = 1;
      else if (novaPos === 'Zagueiro') maxVagas = (esquema === '3-1-1' || esquema === '3-2-1') ? 3 : 2;
      else if (novaPos === 'Lateral Esquerdo' || novaPos === 'Lateral Direito') maxVagas = 1;
      else if (novaPos === 'Meio-campo') maxVagas = (esquema === '2-3-1') ? 3 : 2;
      else if (novaPos === 'Ataque') maxVagas = (esquema === '1-2-2' || esquema === '2-2-2') ? 2 : 1;

      const ocupantesNaPosicao = timeAtletas.filter(atleta => {
        const jReal = window.jogadores.find(x => x.id === atleta.id) || atleta;
        return jReal.id !== jSaindo.id && jReal.statusPresenca !== 'reserva' && (jReal.posicaoEfetivaJogo || jReal.posicao) === novaPos;
      });

      if (ocupantesNaPosicao.length >= maxVagas) {
        const ocupante = window.jogadores.find(x => x.id === ocupantesNaPosicao[0].id) || ocupantesNaPosicao[0];
        
        mudancaPosicaoPendente = { idSaindo: jSaindo.id, posAntigaSaindo: jSaindo.posicaoEfetivaJogo || jSaindo.posicao, idOcupante: ocupante.id, novaPosicao: novaPos };

        document.getElementById('nome-posicao-conflito').innerText = novaPos;
        document.getElementById('nome-ocupante-conflito').innerText = ocupante.apelido;
        
        const btnTroca = document.getElementById('btn-confirmar-troca-direta');
        btnTroca.onclick = () => executarTrocaDiretaPosicoes();

        fecharModalAcao();
        document.getElementById('modal-conflito-posicao').classList.remove('hidden');
      } else {
        jSaindo.posicaoEfetivaJogo = novaPos;
        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
        registrarLog(`Posição efetiva de '${jSaindo.apelido}' alterada para ${novaPos}.`);
        fecharModalAcao();
        window.atualizarInterfaceGeral();
      }
    }

    function fecharModalConflitoPosicao() {
      mudancaPosicaoPendente = null;

    function executarTrocaDiretaPosicoes() {
      if (!mudancaPosicaoPendente) return;
      const { idSaindo, posAntigaSaindo, idOcupante, novaPosicao } = mudancaPosicaoPendente;

      const jSaindo = window.jogadores.find(j => j.id === idSaindo);
      const jOcupante = window.jogadores.find(j => j.id === idOcupante);

      if (jSaindo && jOcupante) {
        jSaindo.posicaoEfetivaJogo = novaPosicao;
        jOcupante.posicaoEfetivaJogo = posAntigaSaindo;

        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
        registrarLog(`Inversão de posição: ${jSaindo.apelido} (${novaPosicao}) e ${jOcupante.apelido} (${posAntigaSaindo}).`);

    function obterResumoCaixinhaMes(mes) {
      const valorPadrao = (window.caixinhaFinanceira && window.caixinhaFinanceira.valorMensalidade) || 50;
      const pagantes = window.jogadores.filter(j => !j.excluido && j.stats && j.stats.mensalidadePaga).map(j => ({
        id: j.id, apelido: j.apelido, valor: Number(j.stats.valorPagoMensalidade || 0), data: j.stats.dataPagamento || null
      }));
      const totalArrecadado = pagantes.reduce((s,p) => s + p.valor, 0);
      const custoQuadra = Number((window.despesasQuadra && window.despesasQuadra[mes]) || 0);
      return { mesAno: mes, valorMensalidade: valorPadrao, pagantes, totalArrecadado, custoQuadra, saldo: totalArrecadado - custoQuadra };
    }

    function arquivarCaixinhaMensal(mes, dataEncerramento) {
      window.historicoCaixinhaMensal = window.historicoCaixinhaMensal || [];
      const resumo = obterResumoCaixinhaMes(mes);
      resumo.dataEncerramento = dataEncerramento || new Date().toLocaleDateString('pt-BR');
      const idx = window.historicoCaixinhaMensal.findIndex(h => h.mesAno === mes);
      if (idx >= 0) window.historicoCaixinhaMensal[idx] = resumo;
      else window.historicoCaixinhaMensal.push(resumo);
    }

    function corrigirCustoQuadraHistorico(mes, novoValor) {
      if (perfilAtual !== 'dono' && perfilAtual !== 'admin') return;
      const val = Number(String(novoValor).replace(',', '.'));
      if (!mes || !Number.isFinite(val) || val < 0) { alert('Informe mês e valor válidos.'); return; }
      window.despesasQuadra[mes] = val;
      window.historicoCaixinhaMensal = window.historicoCaixinhaMensal || [];
      const h = window.historicoCaixinhaMensal.find(x => x.mesAno === mes);
      if (h) { h.custoQuadra = val; h.saldo = Number(h.totalArrecadado || 0) - val; }
      registrarLog(`[CAIXA] ${perfilAtual.toUpperCase()} corrigiu custo da quadra de ${mes} para R$ ${val.toFixed(2)}.`);
      if (window.salvarDadosNuvem) window.salvarDadosNuvem();
      renderFinanceiro();
    }

            <div><span class="text-slate-400">Saldo</span><strong class="block ${Number(h.saldo||0)>=0?'text-amber-300':'text-rose-300'}">R$ ${Number(h.saldo||0).toFixed(2)}</strong></div>

          ${perfilAtual === 'dono' || perfilAtual === 'admin' ? `<div class="flex gap-1.5 pt-1"><input id="hist-custo-${h.mesAno.replace('/','-')}" value="${Number(h.custoQuadra||0).toFixed(2)}" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-[10px]"><button onclick="corrigirCustoQuadraHistorico('${h.mesAno}', document.getElementById('hist-custo-${h.mesAno.replace('/','-')}').value)" class="bg-amber-500 text-slate-950 font-black px-2 rounded-lg text-[10px]">Corrigir</button></div>` : ''}
        </div>`).join('') : '<p class="text-[10px] text-slate-500">Nenhum mês financeiro arquivado ainda.</p>';

    function salvarDespesaQuadraMes() {
      if (perfilAtual !== 'dono' && perfilAtual !== 'admin') return;
      const inputVal = document.getElementById('input-custo-quadra-mes');
      if (!inputVal) return;

      const val = parseFloat(inputVal.value.replace(',', '.'));
      if (isNaN(val) || val < 0) { alert("Valor inválido para o aluguel da quadra!"); return; }

      const mes = window.mesAnoAtivo || "08/2026";
      const anterior = Number((window.despesasQuadra && window.despesasQuadra[mes]) || 0);
      window.despesasQuadra[mes] = val;
      if (window.historicoCaixinhaMensal && window.historicoCaixinhaMensal.find(h => h.mesAno === mes)) {
        const h = window.historicoCaixinhaMensal.find(h => h.mesAno === mes);
        h.custoQuadra = val; h.saldo = Number(h.totalArrecadado || 0) - val;
      }

      if (window.salvarDadosNuvem) window.salvarDadosNuvem();
      registrarLog(`[CAIXA] Custo da quadra para o mês ${mes} ${anterior ? 'corrigido' : 'definido'}: R$ ${anterior.toFixed(2)} → R$ ${val.toFixed(2)}.`);
      alert(`Aluguel da quadra do mês ${mes} salvo com sucesso!`);
      renderFinanceiro();
    }

    let imageCropTemp = new Image();
    let cropContextoOrigem = 'cadastro';

    function abrirModalCrop(event, contexto) {
      const file = event.target.files[0];
      if (!file) return;

      cropContextoOrigem = contexto;
      const reader = new FileReader();

      reader.onload = function(e) {
        imageCropTemp = new Image();
        imageCropTemp.onload = function() {
          document.getElementById('crop-zoom').value = 1;
          const tit = document.getElementById('titulo-modal-crop');
          if (tit) tit.innerText = contexto === 'escudo_time' ? '✂️ Enquadrar Escudo do Time' : '✂️ Enquadrar Foto do Atleta';
          redesenharCropCanvas();
          document.getElementById('modal-crop').classList.remove('hidden');
        };
        imageCropTemp.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function redesenharCropCanvas() {
      const canvas = document.getElementById('crop-canvas');
      const ctx = canvas.getContext('2d');
      const zoom = parseFloat(document.getElementById('crop-zoom').value);

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const minDim = Math.min(imageCropTemp.width, imageCropTemp.height);
      const srcW = minDim / zoom;
      const srcH = minDim / zoom;
      const srcX = (imageCropTemp.width - srcW) / 2;
      const srcY = (imageCropTemp.height - srcH) / 2;

      ctx.drawImage(imageCropTemp, srcX, srcY, srcW, srcH, 0, 0, canvas.width, canvas.height);
    }

    function confirmarCropFoto() {
      const canvasOriginal = document.getElementById('crop-canvas');
      const ctxOriginal = canvasOriginal.getContext('2d');
      const zoom = parseFloat(document.getElementById('crop-zoom').value);

      ctxOriginal.clearRect(0, 0, canvasOriginal.width, canvasOriginal.height);
      const minDim = Math.min(imageCropTemp.width, imageCropTemp.height);
      const srcW = minDim / zoom;
      const srcH = minDim / zoom;
      const srcX = (imageCropTemp.width - srcW) / 2;
      const srcY = (imageCropTemp.height - srcH) / 2;
      ctxOriginal.drawImage(imageCropTemp, srcX, srcY, srcW, srcH, 0, 0, canvasOriginal.width, canvasOriginal.height);

      const canvasPequeno = document.createElement('canvas');
      canvasPequeno.width = 120;
      canvasPequeno.height = 120;
      const ctxPequeno = canvasPequeno.getContext('2d');
      ctxPequeno.drawImage(canvasOriginal, 0, 0, 120, 120);
      
      fotoBase64Recortada = canvasPequeno.toDataURL('image/webp', 0.85);

      if (cropContextoOrigem === 'cadastro') {
        document.getElementById('img-preview-cadastro').src = fotoBase64Recortada;
        document.getElementById('preview-crop-cadastro').classList.remove('hidden');
      } else if (cropContextoOrigem === 'edicao') {
        document.getElementById('img-preview-edicao').src = fotoBase64Recortada;
      } else if (cropContextoOrigem === 'escudo_time') {
        document.getElementById('img-preview-escudo-time').src = fotoBase64Recortada;
      }

      fecharModalCrop();
    }

    function verificarDuplicidade(nomeCompleto, apelido, ignoreId = null) {
      const nomeNorm = nomeCompleto.trim().toLowerCase();
      const apelidoNorm = apelido.trim().toLowerCase();

      const duplicadoCadastrado = window.jogadores.some(j => {
        if (j.excluido) return false;
        if (ignoreId && j.id === ignoreId) return false;
        return (j.nomeCompleto && j.nomeCompleto.trim().toLowerCase() === nomeNorm) || 
               (j.apelido && j.apelido.trim().toLowerCase() === apelidoNorm);
      });

      if (duplicadoCadastrado) return true;

      return window.solicitacoesPendentes.some(s => {
        if (ignoreId && s.id === ignoreId) return false;
        return (s.nomeCompleto && s.nomeCompleto.trim().toLowerCase() === nomeNorm) || 
               (s.apelido && s.apelido.trim().toLowerCase() === apelidoNorm);
      });
    }

    async function enviarSolicitacao(e) {
      e.preventDefault();
      const nome = document.getElementById('sol-nome-completo').value;
      const apelido = document.getElementById('sol-apelido').value;
      const tel = document.getElementById('sol-telefone').value;
      const nascimento = document.getElementById('sol-nascimento').value;
      const senha = document.getElementById('sol-senha').value;
      const pos = document.getElementById('sol-posicao').value;

      if (!fotoBase64Recortada) { alert("Selecione e enquadre a foto do atleta!"); return; }
      if (verificarDuplicidade(nome, apelido)) { alert("Atleta já cadastrado!"); return; }

      window.solicitacoesPendentes.push({
        id: Date.now(),
        nomeCompleto: nome,
        apelido: apelido,
        telefone: tel,
        nascimento: nascimento,
        senha: senha,
        posicao: pos,
        posicaoEfetivaJogo: pos,
        foto: fotoBase64Recortada
      });

      if(window.salvarDadosNuvem) window.salvarDadosNuvem();
      alert("Solicitação enviada!");
      e.target.reset();
      fotoBase64Recortada = '';
      document.getElementById('preview-crop-cadastro').classList.add('hidden');
    }

    function aprovarSolicitacao(id) {
      const idx = window.solicitacoesPendentes.findIndex(s => s.id === id);
      if (idx === -1) return;
      const sol = window.solicitacoesPendentes[idx];

      if (sol.tipo === 'edicao_atleta') {
        if (perfilAtual !== 'admin' && perfilAtual !== 'dono') {
          alert('Somente Administrador ou Dono podem aprovar alterações de atletas.');
          return;
        }
        const atleta = window.jogadores.find(j => j.id === sol.idAtleta && !j.excluido);
        if (!atleta) {
          alert('Atleta não encontrado ou já está inativo.');
          return;
        }
        if (verificarDuplicidade(sol.nomeCompleto, sol.apelido, atleta.id)) {
          alert('A alteração criaria um nome/apelido duplicado.');
          return;
        }

        atleta.nomeCompleto = sol.nomeCompleto;
        atleta.apelido = sol.apelido;
        atleta.telefone = sol.telefone;
        atleta.nascimento = sol.nascimento;
        atleta.senha = sol.senha || atleta.senha || '';
        atleta.posicao = sol.posicao;
        if (!atleta.posicaoEfetivaJogo) atleta.posicaoEfetivaJogo = sol.posicaoEfetivaJogo || sol.posicao;
        if (sol.foto) atleta.foto = sol.foto;

        window.solicitacoesPendentes.splice(idx, 1);
        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
        registrarLog(`${perfilAtual.toUpperCase()} aprovou alteração cadastral do atleta '${atleta.apelido}'.`);
        alert('Alteração do atleta aprovada e aplicada com sucesso!');
        window.atualizarInterfaceGeral();
        return;
      }

      // Solicitação de novo atleta
      if (perfilAtual !== 'admin' && perfilAtual !== 'dono') {
        alert('Somente Administrador ou Dono podem aprovar novos atletas.');
        return;
      }
      const apelidoFinal = document.getElementById(`apelido-aprov-${id}`)?.value || sol.apelido || sol.nomeCompleto.split(' ')[0];
      if (verificarDuplicidade(sol.nomeCompleto, apelidoFinal, sol.id)) { alert('Atleta já cadastrado!'); return; }

      window.jogadores.push({ 
        id: Date.now(), 
        nomeCompleto: sol.nomeCompleto, 
        apelido: apelidoFinal, 
        telefone: sol.telefone || '',
        nascimento: sol.nascimento || '1990-01-01',
        senha: sol.senha || '123',
        foto: sol.foto || '', 
        posicao: sol.posicao,
        posicaoEfetivaJogo: sol.posicao, 
        ehAdmin: false,
        excluido: false,
        statusPresenca: 'ausente', 
        stats: { ...statsPadrao }, 
        avaliacoesRecebidas: [],
        nota: 0.0 
      });
      window.solicitacoesPendentes.splice(idx, 1);
      if(window.salvarDadosNuvem) window.salvarDadosNuvem();
      registrarLog(`${perfilAtual.toUpperCase()} aprovou cadastro do novo atleta '${apelidoFinal}'.`);
      window.atualizarInterfaceGeral();
    }

    function fecharModalEditarJogador() { document.getElementById('modal-editar-jogador').classList.add('hidden'); }

    function salvarEdicaoJogador(e) {
      e.preventDefault();
      const id = parseInt(document.getElementById('edit-jogador-id').value);
      const j = window.jogadores.find(item => item.id === id);
      if (!j || j.excluido) return;

      if (perfilAtual === 'atleta' && usuarioAutenticadoId !== id) {
        alert('Você só pode editar o seu próprio cadastro.');
        return;
      }
      if (perfilAtual !== 'atleta' && perfilAtual !== 'admin' && perfilAtual !== 'dono') {
        alert('Perfil sem permissão para editar atletas.');
        return;
      }

      const nomeCompleto = document.getElementById('edit-nome-completo').value.trim();
      const apelido = document.getElementById('edit-apelido').value.trim();
      const telefone = document.getElementById('edit-telefone').value.trim();
      const nascimento = document.getElementById('edit-nascimento').value;
      const senha = document.getElementById('edit-senha').value.trim();
      const posicao = document.getElementById('edit-posicao').value;
      const fotoNova = fotoBase64Recortada || j.foto || '';

      if (!nomeCompleto || !apelido || !telefone || !nascimento || !posicao) {
        alert('Preencha todos os campos obrigatórios.');
        return;
      }
      if (verificarDuplicidade(nomeCompleto, apelido, j.id)) {
        alert('Atleta já cadastrado!');
        return;
      }

      // Atleta nunca altera o cadastro diretamente: cria uma solicitação para aprovação do Administrador.
      if (perfilAtual === 'atleta') {
        const existePendente = window.solicitacoesPendentes.some(s =>
          s.tipo === 'edicao_atleta' && s.idAtleta === id && s.status !== 'rejeitada'
        );
        if (existePendente) {
          alert('Você já possui uma alteração pendente de aprovação.');
          return;
        }

        window.solicitacoesPendentes.push({
          id: Date.now(),
          tipo: 'edicao_atleta',
          idAtleta: id,
          solicitanteId: usuarioAutenticadoId,
          solicitante: 'atleta',
          nomeCompleto,
          apelido,
          telefone,
          nascimento,
          senha: senha || j.senha || '',
          posicao,
          posicaoEfetivaJogo: j.posicaoEfetivaJogo || posicao,
          foto: fotoNova,
          dataSolicitacao: new Date().toLocaleString('pt-BR')
        });

        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
        alert('Alteração enviada para aprovação do Administrador. O cadastro atual permanece inalterado até a aprovação.');
        fecharModalEditarJogador();
        window.atualizarInterfaceGeral();
        return;
      }

      // Admin e Dono podem editar diretamente.
      const ehAdmin = perfilAtual === 'dono' ? document.getElementById('edit-eh-admin').checked : j.ehAdmin;
      let novaNota = j.nota || 0;
      if (perfilAtual === 'dono') {
        const valNotaInput = parseFloat(document.getElementById('edit-nota-direta').value);
        if (!isNaN(valNotaInput)) novaNota = Math.max(0, Math.min(5, valNotaInput));
      }

      j.nomeCompleto = nomeCompleto;
      j.apelido = apelido;
      j.telefone = telefone;
      j.nascimento = nascimento;
      j.senha = senha || j.senha || '';
      j.posicao = posicao;
      if (!j.posicaoEfetivaJogo) j.posicaoEfetivaJogo = posicao;
      j.ehAdmin = ehAdmin;
      j.foto = fotoNova;
      j.nota = novaNota;

      if (window.salvarDadosNuvem) window.salvarDadosNuvem();
      registrarLog(`${perfilAtual.toUpperCase()} atualizou o cadastro do atleta '${j.apelido}'.`);
      alert('Cadastro atualizado com sucesso!');
      fecharModalEditarJogador();
      window.atualizarInterfaceGeral();
    }

    function solicitarOuExcluirJogador(id) {
      const j = window.jogadores.find(item => item.id === id);
      if (!j || j.excluido) return;

      if (perfilAtual === 'dono') {
        if (confirm(`Excluir atleta '${j.apelido}'?`)) { executarExclusaoAtleta(id); }
      } else if (perfilAtual === 'admin') {
        if (confirm(`Solicitar exclusão do atleta '${j.apelido}' ao Dono?`)) {
          if (!window.solicitacoesExclusao.some(s => s.idAtleta === id)) {
            window.solicitacoesExclusao.push({ idSol: Date.now(), idAtleta: id, apelidoAtleta: j.apelido, solicitante: perfilAtual });
            if (window.salvarDadosNuvem) window.salvarDadosNuvem();
            alert(`Solicitação enviada ao Dono!`);
            window.atualizarInterfaceGeral();
          } else { alert("Solicitação já pendente!"); }
        }
      }
    }

    function aprovarExclusaoPeloDono(idSol, aprovar) {
      if (perfilAtual !== 'dono') { alert('Somente o Dono pode aprovar exclusões.'); return; }
      const idxSol = window.solicitacoesExclusao.findIndex(s => s.idSol === idSol);
      if (idxSol === -1) return;
      const sol = window.solicitacoesExclusao[idxSol];

      if (aprovar) { executarExclusaoAtleta(sol.idAtleta); }
      window.solicitacoesExclusao.splice(idxSol, 1);
      if (window.salvarDadosNuvem) window.salvarDadosNuvem();
      window.atualizarInterfaceGeral();
    }

    function executarExclusaoAtleta(idAtleta) {
      if (perfilAtual !== 'dono') {
        alert('Somente o Dono pode excluir definitivamente um atleta.');
        return false;
      }
      const j = window.jogadores.find(item => item.id === idAtleta);
      if (j) {
        j.excluido = true;
        j.statusPresenca = 'ausente';

        ['A', 'B', 'C'].forEach(tk => {
          if (window.timesGlobais[tk]) {
            window.timesGlobais[tk] = window.timesGlobais[tk].filter(item => item.id !== idAtleta);
          }
        });

        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
        alert(`Atleta '${j.apelido}' removido!`);
        return true;
      }
      return false;
    }

    function marcarAtletaComoFaltante(idAtleta) {
      if (perfilAtual === 'visitante') { alert("Perfil Visitante apenas visualiza."); return; }
      const j = window.jogadores.find(x => x.id === idAtleta);
      if (!j) return;

      if (confirm(`Confirmar remoção de '${j.apelido}' da partida? Ele será marcado como AUSENTE.`)) {
        j.statusPresenca = 'ausente';

        ['A', 'B', 'C'].forEach(tk => {
          if (window.timesGlobais[tk]) {
            window.timesGlobais[tk] = window.timesGlobais[tk].filter(item => item.id !== idAtleta);
          }
        });

        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
        registrarLog(`Atleta '${j.apelido}' marcado como faltante e removido.`);

    function sugerirEsquemaTaticoAutomatico(titularesTime) {
      if (!titularesTime || titularesTime.length === 0) return '2-2-1';
      const qtdLinha = titularesTime.filter(j => (j.posicaoEfetivaJogo || j.posicao) !== 'Goleiro').length;

      let qtdAtaque = 0; let qtdDefesa = 0;
      titularesTime.forEach(atleta => {
        const pos = atleta.posicaoEfetivaJogo || atleta.posicao;
        if (pos === 'Ataque') qtdAtaque++;
        else if (pos === 'Zagueiro' || pos.includes('Lateral')) qtdDefesa++;
      });

      if (qtdLinha >= 6) {
        if (qtdAtaque >= 2) return '2-2-2';
        if (qtdDefesa >= 3) return '3-2-1';
        return '2-3-1';
      } else {
        if (qtdAtaque >= 2) return '1-2-2';
        if (qtdDefesa >= 3) return '3-1-1';
        return '2-2-1';
      }
    }

    function executarSorteio() {
      if (perfilAtual === 'visitante' || perfilAtual === 'atleta') { alert("Perfil Visitante apenas visualiza."); return; }
      const elegiveis = window.jogadores.filter(j => !j.excluido && (j.statusPresenca === 'jogo' || j.statusPresenca === 'reserva'));

      if (elegiveis.length < 2) { alert("Mínimo de 2 jogadores!"); return; }

      const goleiros = elegiveis.filter(j => j.posicao === 'Goleiro');
      const zagueiros = elegiveis.filter(j => j.posicao === 'Zagueiro' || j.posicao.includes('Lateral'));
      const meios = elegiveis.filter(j => j.posicao === 'Meio-campo');
      const ataques = elegiveis.filter(j => j.posicao === 'Ataque');

      const embaralhar = (arr) => {
        let array = [...arr];
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      };

      const modo3 = document.getElementById('modo-sorteio').value === "3";
      let times = modo3 ? { A: [], B: [], C: [] } : { A: [], B: [] };
      const chavesTimes = Object.keys(times);

      const distribuirGrupo = (grupo) => {
        const embaralhado = embaralhar(grupo);
        embaralhado.forEach((atleta, index) => {
          const destinoKey = chavesTimes[index % chavesTimes.length];
          atleta.posicaoEfetivaJogo = atleta.posicao;
          times[destinoKey].push({ id: atleta.id, apelido: atleta.apelido, posicao: atleta.posicao, statusPresenca: atleta.statusPresenca });
        });
      };

      distribuirGrupo(goleiros);
      distribuirGrupo(zagueiros);
      distribuirGrupo(meios);
      distribuirGrupo(ataques);

      window.timesGlobais = times;
      timeAAtual = 'A'; timeBAtual = 'B'; timeEspera = 'C';
      jogosSeguidosTimeA = 0; jogosSeguidosTimeB = 0;
      numeroPartidaAtual = 1;
      window.placar = {a:0,b:0};
      window.historicoAcoesPartida = []; window.statsPartidaAtual = {}; window.idCraqueRodada = null;
      window.esquemaTaticoTimeA = 'auto';
      window.esquemaTaticoTimeB = 'auto';
      window.esquemaTaticoTimeC = 'auto';
      escalacaoAjustadaEConfirmada = true;

      if (window.salvarDadosNuvem) window.salvarDadosNuvem();
      
      document.getElementById('btn-refazer-sorteio').classList.remove('hidden');
      registrarLog(`Sorteio tático por setor realizado.`);
      alert(`Sorteio equilibrado por posição realizado!`);
      window.atualizarInterfaceGeral();
    }

      (window.timesGlobais[timeGanhador] || []).forEach(atleta => {

    function aplicarPenalidadeEGanhosDefesa(timeA, timeB, placarA, placarB) {
      const atA = window.timesGlobais[timeA] || [];
      const atB = window.timesGlobais[timeB] || [];

      const processarTime = (atletasTime, golsSofridosQtd) => {
        atletasTime.forEach(item => {
          const j = window.jogadores.find(x => x.id === item.id);
          if (j) {
            if (!j.stats) j.stats = { ...statsPadrao };
            const pos = j.posicaoEfetivaJogo || j.posicao;
            const ehDefesa = pos === 'Goleiro' || pos === 'Zagueiro' || pos.includes('Lateral');

            if (ehDefesa) {
              j.stats.golsSofridos = (j.stats.golsSofridos || 0) + golsSofridosQtd;
              if (golsSofridosQtd === 0) {
                j.stats.cleanSheets = (j.stats.cleanSheets || 0) + 1;
                j.stats.muralhaSequencia = (j.stats.muralhaSequencia || 0) + 1;
              } else { j.stats.muralhaSequencia = 0; }
            }
          }
        });
      };

      processarTime(atA, placarB);
      processarTime(atB, placarA);
    }

    function gerarResumoPartidaAtual(timeA, timeB, placarA, placarB, numero) {
      const ids = new Set([...(window.timesGlobais[timeA] || []), ...(window.timesGlobais[timeB] || [])].map(x => x.id));
      const atletas = [];
      ids.forEach(id => {
        const j = window.jogadores.find(x => x.id === id);
        if (!j) return;
        const s = (window.statsPartidaAtual && window.statsPartidaAtual[id]) || {};
        const entrou = (s.gols||0)+(s.assistencias||0)+(s.defesasLinha||0)+(s.defesasPenalti||0)+(s.finalizacoesFora||0)>0;
        const participou = entrou || (j.statusPresenca === 'jogo');
        if (!participou) return;
        atletas.push({ id:j.id, apelido:j.apelido, foto:j.foto||'', time:(window.timesGlobais[timeA]||[]).some(x=>x.id===id)?timeA:timeB, posicao:j.posicaoEfetivaJogo||j.posicao, stats:{...s} });
      });
      return { numeroPartida: numero, dataHora: new Date().toISOString(), timeA, timeB, placarA, placarB, resultado: placarA===placarB?'empate':(placarA>placarB?timeA:timeB), gols:[...eventosJogoAtual], atletas };
    }

    function encerrarJogoDefinitivo() {
      tocarSomApito();
      const modo3 = document.getElementById('modo-sorteio').value === "3";

        if (numeroPartidaAtual === 1 && window.placar.a === window.placar.b) {
          alert("Empate na 1ª partida! Clique em 'Decidir Empate no Par ou Ímpar'.");

        const timeGanhador = window.placar.a >= window.placar.b ? timeAAtual : timeBAtual;
        atribuirPontosVitoria(timeGanhador);
        registrarJogoParaAtletasDaPartida();
        aplicarPenalidadeEGanhosDefesa(timeAAtual, timeBAtual, window.placar.a, window.placar.b);

        window.historicoJogosDia.push(gerarResumoPartidaAtual(timeAAtual, timeBAtual, window.placar.a, window.placar.b, numeroPartidaAtual));

        eventosJogoAtual = [];
        window.statsPartidaAtual = {};
        registrarLog(`Fim Jogo #${numeroPartidaAtual}: Time ${timeGanhador} Venceu`);
        alert(`Partida #${numeroPartidaAtual} Encerrada! Miniaturas zeradas para a próxima.`);
        executarRotacaoAposResultado(timeGanhador);
      } else {
        const timeGanhador = window.placar.a > window.placar.b ? timeAAtual : (window.placar.b > window.placar.a ? timeBAtual : null);
        if (timeGanhador) atribuirPontosVitoria(timeGanhador);
        registrarJogoParaAtletasDaPartida();
        aplicarPenalidadeEGanhosDefesa(timeAAtual, timeBAtual, window.placar.a, window.placar.b);

        window.historicoJogosDia.push(gerarResumoPartidaAtual(timeAAtual, timeBAtual, window.placar.a, window.placar.b, 1));

        eventosJogoAtual = [];
        window.statsPartidaAtual = {};
        registrarLog(`Fim de jogo: Placar Final A ${window.placar.a} x ${window.placar.b} B`);
        alert(`Partida encerrada! Miniaturas zeradas para a próxima.`);
        window.placar = { a: 0, b: 0 }; 
        if(window.salvarDadosNuvem) window.salvarDadosNuvem();
        resetTimer(); 
        window.atualizarInterfaceGeral();
      }
    }

    function executarRotacaoAposResultado(timeGanhador) {
      const oldA = timeAAtual;
      const oldB = timeBAtual;
      const oldEspera = timeEspera;
      let timeSaindo;

      // A equipe que acabou de completar 2 jogos consecutivos sai após esta partida.
      const streakAposJogoA = timeGanhador === oldA ? jogosSeguidosTimeA + 1 : 0;
      const streakAposJogoB = timeGanhador === oldB ? jogosSeguidosTimeB + 1 : 0;

      if (streakAposJogoA >= 2) timeSaindo = oldA;
      else if (streakAposJogoB >= 2) timeSaindo = oldB;
      else timeSaindo = timeGanhador === oldA ? oldB : oldA;

      const goleiroFixoSaindo = (window.timesGlobais[timeSaindo] || [])[0];
      const novosJogadoresLinhaEntrando = (window.timesGlobais[oldEspera] || []).slice(1);

      if (!goleiroFixoSaindo) {
        alert('Não foi possível completar o rodízio: time de saída sem goleiro/jogadores.');
        return;
      }

      if (timeSaindo === oldA) {
        timeAAtual = oldEspera;
        window.timesGlobais[timeAAtual] = [goleiroFixoSaindo, ...novosJogadoresLinhaEntrando];
        jogosSeguidosTimeA = 0;
        jogosSeguidosTimeB = streakAposJogoB;
      } else {
        timeBAtual = oldEspera;
        window.timesGlobais[timeBAtual] = [goleiroFixoSaindo, ...novosJogadoresLinhaEntrando];
        jogosSeguidosTimeB = 0;
        jogosSeguidosTimeA = streakAposJogoA;
      }

      // O time que saiu passa a esperar. O time que entrou começa com 0 jogos consecutivos.
      timeEspera = timeSaindo;
      window.placar = { a: 0, b: 0 };
      numeroPartidaAtual++;
      if (window.salvarDadosNuvem) window.salvarDadosNuvem();
      resetTimer();
      window.atualizarInterfaceGeral();
    }

    function alternarTitularReservaNoSorteio(idAtleta, novoStatus) {
      const jReal = window.jogadores.find(j => j.id === idAtleta);
      if (jReal) {
        jReal.statusPresenca = novoStatus;
        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
        window.atualizarInterfaceGeral();
      }
    }

    function trocarTimeJogador(timeOrigem, idAtleta, timeDestino) {
      if (timeOrigem === timeDestino) return;
      const idxAtleta = (window.timesGlobais[timeOrigem] || []).findIndex(j => j.id === idAtleta);
      if (idxAtleta !== -1) {
        const jogadorMover = window.timesGlobais[timeOrigem].splice(idxAtleta, 1)[0];
        if (jogadorMover) {
          if (!window.timesGlobais[timeDestino]) window.timesGlobais[timeDestino] = [];
          window.timesGlobais[timeDestino].push(jogadorMover);
          if (window.salvarDadosNuvem) window.salvarDadosNuvem();
          window.atualizarInterfaceGeral();
        }
      }
    }

    function confirmarAlteracoesTimesManual() {

      renderCampo();
      renderResultadoSorteioEEdicao();
      registrarLog("Alterações de times/reservas aplicadas ao campo.");
      alert("Formação salva com sucesso e aplicada ao Campo!");
    }

    function atualizarPainelTrocaReservas() {
      const divResA = document.getElementById('reservas-time-a');
      const divResB = document.getElementById('reservas-time-b');
      const alertTempo = document.getElementById('alerta-troca-tempo');
      const painelTroca = document.getElementById('painel-troca-reserva');
      const selectTitular = document.getElementById('select-titular-sair');

      if (!divResA || !divResB) return;
      divResA.innerHTML = ''; divResB.innerHTML = '';

      const tA = (window.timesGlobais[timeAAtual] || []).filter(i => { const j = window.jogadores.find(x => x.id === i.id); return j ? (!j.excluido && j.statusPresenca !== 'ausente') : true; });
      const tB = (window.timesGlobais[timeBAtual] || []).filter(i => { const j = window.jogadores.find(x => x.id === i.id); return j ? (!j.excluido && j.statusPresenca !== 'ausente') : true; });

      const reservasA = tA.filter(item => { const j = window.jogadores.find(x => x.id === item.id); return j && j.statusPresenca === 'reserva'; });
      const reservasB = tB.filter(item => { const j = window.jogadores.find(x => x.id === item.id); return j && j.statusPresenca === 'reserva'; });

      const renderReservaItem = (res, container) => {
        const jReal = window.jogadores.find(x => x.id === res.id) || res;
        const div = document.createElement('div');
        div.className = "flex items-center gap-1.5 bg-slate-900/90 p-1 rounded text-[10px] border border-slate-800";
        div.innerHTML = `
          <span class="w-2 h-2 rounded-full bg-amber-400"></span>
          <span class="font-bold text-white">${jReal.apelido}</span>
          <span class="text-[8px] text-slate-400">(${jReal.posicaoEfetivaJogo || jReal.posicao})</span>
        `;
        container.appendChild(div);
      };

      reservasA.forEach(r => renderReservaItem(r, divResA));
      reservasB.forEach(r => renderReservaItem(r, divResB));

      if (reservasA.length === 0) divResA.innerHTML = `<span class="text-[9px] text-slate-500 italic">Sem reservas</span>`;
      if (reservasB.length === 0) divResB.innerHTML = `<span class="text-[9px] text-slate-500 italic">Sem reservas</span>`;

      if (alertTempo) alertTempo.classList.toggle('hidden', !tempoEncerrado);

      const ehAdminOuDono = perfilAtual === 'dono' || perfilAtual === 'admin';
      const temReservas = (reservasA.length + reservasB.length) > 0;

      if (painelTroca && selectTitular) {
        if (ehAdminOuDono && temReservas) {
          painelTroca.classList.remove('hidden');
          const titulares = [
            ...tA.filter(item => { const j = window.jogadores.find(x => x.id === item.id); return j && j.statusPresenca !== 'reserva'; }),
            ...tB.filter(item => { const j = window.jogadores.find(x => x.id === item.id); return j && j.statusPresenca !== 'reserva'; })
          ];

          selectTitular.innerHTML = '<option value="" disabled selected>Selecione o Titular...</option>' + 
            titulares.map(atleta => {
              const jReal = window.jogadores.find(j => j.id === atleta.id) || atleta;
              const timePertence = (window.timesGlobais[timeAAtual] || []).some(x => x.id === jReal.id) ? `Time ${timeAAtual}` : `Time ${timeBAtual}`;
              return `<option value="${jReal.id}">${jReal.apelido} (${timePertence})</option>`;
            }).join('');

          atualizarListaReservasDoMesmoTime(selectTitular.value);
        } else { painelTroca.classList.add('hidden'); }
      }
    }

    function atualizarListaReservasDoMesmoTime(idTitularSaindoStr) {
      const selectReserva = document.getElementById('select-reserva-entrar');
      if (!selectReserva) return;

      const idTitularSaindo = parseInt(idTitularSaindoStr);
      if (!idTitularSaindo) { selectReserva.innerHTML = `<option value="">Selecione o titular...</option>`; return; }

      let timeKeyAtleta = null;
      if ((window.timesGlobais[timeAAtual] || []).some(x => x.id === idTitularSaindo)) { timeKeyAtleta = timeAAtual; }
      else if ((window.timesGlobais[timeBAtual] || []).some(x => x.id === idTitularSaindo)) { timeKeyAtleta = timeBAtual; }

      if (!timeKeyAtleta) { selectReserva.innerHTML = `<option value="">Erro ao localizar time</option>`; return; }

      const reservasDoMesmoTime = (window.timesGlobais[timeKeyAtleta] || []).filter(item => {
        const jReal = window.jogadores.find(j => j.id === item.id) || item;
        return jReal.statusPresenca === 'reserva';
      });

      if (reservasDoMesmoTime.length === 0) {
        selectReserva.innerHTML = `<option value="">Sem reservas no Time ${timeKeyAtleta}</option>`;
      } else {
        selectReserva.innerHTML = reservasDoMesmoTime.map(r => {
          const jReal = window.jogadores.find(j => j.id === r.id) || r;
          return `<option value="${jReal.id}">${jReal.apelido} (${jReal.posicao})</option>`;
        }).join('');
      }
    }

    function efetuarTrocaReserva() {
      const idSair = parseInt(document.getElementById('select-titular-sair').value);
      const idEntrar = parseInt(document.getElementById('select-reserva-entrar').value);
      const novaPosicaoEfetiva = document.getElementById('select-posicao-efetiva').value;

      if (!idSair || !idEntrar) return;

      let timeKeyEncontrado = null;
      ['A', 'B', 'C'].forEach(tk => {
        if (window.timesGlobais[tk] && window.timesGlobais[tk].some(atleta => atleta.id === idSair)) {
          timeKeyEncontrado = tk;
        }
      });

      if (!timeKeyEncontrado) return;

      const timeArray = window.timesGlobais[timeKeyEncontrado];
      const idxSaindo = timeArray.findIndex(a => a.id === idSair);
      const idxEntrando = timeArray.findIndex(a => a.id === idEntrar);

      const titularSaindoObj = window.jogadores.find(j => j.id === idSair);
      const reservaEntrandoObj = window.jogadores.find(j => j.id === idEntrar);

      if (titularSaindoObj && reservaEntrandoObj && idxSaindo !== -1 && idxEntrando !== -1) {
        const temp = timeArray[idxSaindo];
        timeArray[idxSaindo] = timeArray[idxEntrando];
        timeArray[idxEntrando] = temp;

        titularSaindoObj.statusPresenca = 'reserva';
        reservaEntrandoObj.statusPresenca = 'jogo';
        reservaEntrandoObj.posicaoEfetivaJogo = novaPosicaoEfetiva;

        if (window.salvarDadosNuvem) window.salvarDadosNuvem();
        registrarLog(`Substituição: ${reservaEntrandoObj.apelido} entrou no lugar de ${titularSaindoObj.apelido}.`);
        alert(`🔁 Substituição Efetuada com Sucesso!\nEntra: ${reservaEntrandoObj.apelido}\nSai: ${titularSaindoObj.apelido}`);
        window.atualizarInterfaceGeral();
      }
    }

    function renderCampo() {
      document.getElementById('placar-a').innerText = window.placar.a || 0;
      document.getElementById('placar-b').innerText = window.placar.b || 0;

      const idsA = ['a-gk', 'a-z1', 'a-z2', 'a-z3', 'a-l1', 'a-l2', 'a-m1', 'a-m2', 'a-m3', 'a-a1', 'a-a2'];
      const idsB = ['b-gk', 'b-z1', 'b-z2', 'b-z3', 'b-l1', 'b-l2', 'b-m1', 'b-m2', 'b-m3', 'b-a1', 'b-a2'];
      idsA.concat(idsB).forEach(id => { const el = document.getElementById(`pos-${id}`); if(el) el.innerHTML = ''; });

      document.getElementById('label-time-a').innerText = `Time ${timeAAtual}`;
      document.getElementById('label-time-b').innerText = `Time ${timeBAtual}`;

      const tA = (window.timesGlobais[timeAAtual] && window.timesGlobais[timeAAtual].length) ? window.timesGlobais[timeAAtual] : window.jogadores.filter(j=>!j.excluido).slice(0, 7);
      const tB = (window.timesGlobais[timeBAtual] && window.timesGlobais[timeBAtual].length) ? window.timesGlobais[timeBAtual] : window.jogadores.filter(j=>!j.excluido).slice(7, 14);

      const titularesTimeA = tA.filter(j => {
        const jReal = window.jogadores.find(x => x.id === j.id) || j;
        return jReal.statusPresenca !== 'reserva' && jReal.statusPresenca !== 'ausente' && !jReal.excluido;
      });

      const titularesTimeB = tB.filter(j => {
        const jReal = window.jogadores.find(x => x.id === j.id) || j;
        return jReal.statusPresenca !== 'reserva' && jReal.statusPresenca !== 'ausente' && !jReal.excluido;
      });

      let esquemaA = window.esquemaTaticoTimeA;
      if (esquemaA === 'auto') { esquemaA = sugerirEsquemaTaticoAutomatico(titularesTimeA); }

      let esquemaB = window.esquemaTaticoTimeB;

      const selectCampoA = document.getElementById('select-esquema-time-a');
      if (selectCampoA) selectCampoA.value = window.esquemaTaticoTimeA;

      const selectCampoB = document.getElementById('select-esquema-time-b');
      if (selectCampoB) selectCampoB.value = window.esquemaTaticoTimeB;

      organizarAtletasNoCampo(tA, 'A', esquemaA);
      organizarAtletasNoCampo(tB, 'B', esquemaB);

      checarEExibirBotaoParImpar();
    }

    function organizarAtletasNoCampo(listaAtletas, ladoTime, esquema) {
      const lado = ladoTime.toLowerCase();
      let vagasPorPosicao = {};

      if (esquema === '2-2-1') {
        vagasPorPosicao = { 'Goleiro': [`pos-${lado}-gk`], 'Zagueiro': [`pos-${lado}-z1`, `pos-${lado}-z2`], 'Lateral Esquerdo': [`pos-${lado}-l1`], 'Lateral Direito': [`pos-${lado}-l2`], 'Meio-campo': [`pos-${lado}-m1`, `pos-${lado}-m2`], 'Ataque': [`pos-${lado}-a1`] };
      } else if (esquema === '3-1-1') {
        vagasPorPosicao = { 'Goleiro': [`pos-${lado}-gk`], 'Zagueiro': [`pos-${lado}-z3`, `pos-${lado}-z1`, `pos-${lado}-z2`], 'Lateral Esquerdo': [`pos-${lado}-l1`], 'Lateral Direito': [`pos-${lado}-l2`], 'Meio-campo': [`pos-${lado}-m1`], 'Ataque': [`pos-${lado}-a1`] };
      } else if (esquema === '1-2-2') {
        vagasPorPosicao = { 'Goleiro': [`pos-${lado}-gk`], 'Zagueiro': [`pos-${lado}-z3`], 'Lateral Esquerdo': [`pos-${lado}-l1`], 'Lateral Direito': [`pos-${lado}-l2`], 'Meio-campo': [`pos-${lado}-m2`, `pos-${lado}-m3`], 'Ataque': [`pos-${lado}-a1`, `pos-${lado}-a2`] };
      } else if (esquema === '2-3-1') {
        vagasPorPosicao = { 'Goleiro': [`pos-${lado}-gk`], 'Zagueiro': [`pos-${lado}-z1`, `pos-${lado}-z2`], 'Lateral Esquerdo': [`pos-${lado}-l1`], 'Lateral Direito': [`pos-${lado}-l2`], 'Meio-campo': [`pos-${lado}-m1`, `pos-${lado}-m2`, `pos-${lado}-m3`], 'Ataque': [`pos-${lado}-a1`] };
      } else if (esquema === '3-2-1') {
        vagasPorPosicao = { 'Goleiro': [`pos-${lado}-gk`], 'Zagueiro': [`pos-${lado}-z1`, `pos-${lado}-z2`, `pos-${lado}-z3`], 'Lateral Esquerdo': [`pos-${lado}-l1`], 'Lateral Direito': [`pos-${lado}-l2`], 'Meio-campo': [`pos-${lado}-m2`, `pos-${lado}-m3`], 'Ataque': [`pos-${lado}-a1`] };
      } else if (esquema === '2-2-2') {
        vagasPorPosicao = { 'Goleiro': [`pos-${lado}-gk`], 'Zagueiro': [`pos-${lado}-z1`, `pos-${lado}-z2`], 'Lateral Esquerdo': [`pos-${lado}-l1`], 'Lateral Direito': [`pos-${lado}-l2`], 'Meio-campo': [`pos-${lado}-m2`, `pos-${lado}-m3`], 'Ataque': [`pos-${lado}-a1`, `pos-${lado}-a2`] };
      } else {
        vagasPorPosicao = { 'Goleiro': [`pos-${lado}-gk`], 'Zagueiro': [`pos-${lado}-z1`, `pos-${lado}-z2`], 'Lateral Esquerdo': [`pos-${lado}-l1`], 'Lateral Direito': [`pos-${lado}-l2`], 'Meio-campo': [`pos-${lado}-m1`], 'Ataque': [`pos-${lado}-a1`] };
      }

      const vagasOcupadas = new Set();
      const esquemas6 = ['2-3-1', '3-2-1', '2-2-2'];
      const maxVagasValidas = esquemas6.includes(esquema) ? 7 : 6;
      const todasVagasValidas = Object.values(vagasPorPosicao).flat().slice(0, maxVagasValidas);

      const titulares = listaAtletas.filter(j => {
        const original = window.jogadores.find(x => x.id === j.id);
        return original ? (!original.excluido && original.statusPresenca !== 'reserva' && original.statusPresenca !== 'ausente') : (j.statusPresenca !== 'reserva' && j.statusPresenca !== 'ausente');
      });

      titulares.forEach(atleta => {
        const jReal = window.jogadores.find(j => j.id === atleta.id) || atleta;
        if (jReal.excluido || jReal.statusPresenca === 'ausente') return;

        const pos = jReal.posicaoEfetivaJogo || jReal.posicao || 'Ataque';
        let vagaLivre = (vagasPorPosicao[pos] || []).find(v => !vagasOcupadas.has(v));

        if (!vagaLivre) { vagaLivre = todasVagasValidas.find(v => !vagasOcupadas.has(v)); }

        if (vagaLivre && vagasOcupadas.size < maxVagasValidas) {
          vagasOcupadas.add(vagaLivre);
          renderAtletaNaPosicao(jReal, vagaLivre, ladoTime);
        }
      });
    }

    function renderAtletaNaPosicao(atleta, containerId, timeLabel) {
      const container = document.getElementById(containerId); if (!container) return;
      const jReal = window.jogadores.find(j => j.id === atleta.id) || atleta;
      if (jReal.excluido || jReal.statusPresenca === 'ausente') return;

      const stPartida = (window.statsPartidaAtual && window.statsPartidaAtual[jReal.id]) || { gols: 0, assistencias: 0, defesasLinha: 0, defesasPenalti: 0, finalizacoesFora: 0 };
      const div = document.createElement('div'); div.className = "relative flex flex-col items-center justify-center";
      const bgCor = timeLabel === 'A' ? 'bg-amber-400 text-slate-950' : 'bg-blue-600 text-white';
      
      let badges = "";
      if (stPartida.gols > 0) badges += `<span class="bg-emerald-600 text-white text-[7px] font-bold px-1 rounded-full">⚽${stPartida.gols}</span>`;
      if (stPartida.assistencias > 0) badges += `<span class="bg-teal-600 text-white text-[7px] font-bold px-1 rounded-full">👟${stPartida.assistencias}</span>`;
      if (stPartida.defesasLinha > 0) badges += `<span class="bg-blue-600 text-white text-[7px] font-bold px-1 rounded-full">🛡️${stPartida.defesasLinha}</span>`;
      if (stPartida.defesasPenalti > 0) badges += `<span class="bg-indigo-600 text-white text-[7px] font-bold px-1 rounded-full">🧤${stPartida.defesasPenalti}</span>`;
      if (stPartida.finalizacoesFora > 0) badges += `<span class="bg-rose-600 text-white text-[7px] font-bold px-1 rounded-full">❌${stPartida.finalizacoesFora}</span>`;

      const avatarHTML = jReal.foto 
        ? `<img src="${jReal.foto}" class="w-full h-full object-cover">` 
        : `<span class="font-black text-xs">${jReal.apelido.substring(0,1).toUpperCase()}</span>`;

      div.innerHTML = `
        <button onclick="abrirModalAcao(${jReal.id}, '${timeLabel}')" class="w-7 h-7 ${bgCor} font-black rounded-full flex items-center justify-center border-2 border-white/90 overflow-hidden cursor-pointer shadow-md">
          ${avatarHTML}
        </button>
        ${badges ? `<div class="absolute -top-2 -right-2 flex flex-col gap-0.5 z-20">${badges}</div>` : ''}
        <span class="text-[7px] font-black text-slate-950 bg-white/95 px-1 rounded truncate max-w-[42px] mt-0.5 shadow">${jReal.apelido}</span>
      `;
      container.appendChild(div);
    }

    function alternarLiberacaoVotacao(status) {
      window.votacaoLiberada = status;
      if (!status) {
        window.jogadores.forEach(j => { j.avaliacoesRecebidas = []; });
        registrarLog("Votação mensal encerrada.");
        alert("Votação encerrada com sucesso!");
      } else {
        registrarLog("Votação liberada.");
        alert("Votação liberada para os atletas!");
      }
      if (window.salvarDadosNuvem) window.salvarDadosNuvem();
      window.atualizarInterfaceGeral();
    }

    function renderAvaliacoes() {
      const container = document.getElementById('area-votacao'); if(!container) return; container.innerHTML = '';
      const isVisitante = perfilAtual === 'visitante';
      const opcoesNotas = [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5];

      const badgeStatus = document.getElementById('badge-status-votacao');
      if (badgeStatus) {
        if (window.votacaoLiberada) {
          badgeStatus.innerText = "LIBERADA";
          badgeStatus.className = "text-[10px] font-black px-2 py-0.5 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
        } else {
          badgeStatus.innerText = "BLOQUEADA";
          badgeStatus.className = "text-[10px] font-black px-2 py-0.5 rounded-lg bg-rose-500/20 text-rose-300 border border-rose-500/40";
        }
      }

      const ordemPosicoes = ['Goleiro', 'Zagueiro', 'Lateral Esquerdo', 'Lateral Direito', 'Meio-campo', 'Ataque'];

      ordemPosicoes.forEach(posCat => {
        const atletasNaPos = window.jogadores.filter(j => !j.excluido && j.posicao === posCat);
        if (atletasNaPos.length === 0) return;

        const blocoPos = document.createElement('div');
        blocoPos.className = "bg-slate-950/80 p-3 rounded-2xl border border-indigo-500/30 space-y-2";
        blocoPos.innerHTML = `<h4 class="font-black text-xs text-amber-300 border-b border-slate-800 pb-1 uppercase tracking-wider">${posCat}s</h4>`;

        const subLista = document.createElement('div');
        subLista.className = "space-y-2";

        atletasNaPos.forEach(avaliado => {
          if (!avaliado.avaliacoesRecebidas) avaliado.avaliacoesRecebidas = [];
          const jaVotou = usuarioAutenticadoId ? avaliado.avaliacoesRecebidas.some(v => v.votanteId === usuarioAutenticadoId) : false;

          const ehProprioUsuario = (usuarioAutenticadoId && typeof usuarioAutenticadoId === 'number' && avaliado.id === usuarioAutenticadoId);

          const div = document.createElement('div'); 
          div.className = "bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 flex items-center justify-between text-xs";
          
          let selectHTML = '';

          if (!window.votacaoLiberada) {
            selectHTML = `<span class="text-[10px] text-amber-400/80 font-bold italic">Aguardando liberação</span>`;
          } else if (isVisitante) {
            selectHTML = `<span class="text-[10px] text-slate-500 italic">Somente Leitura</span>`;
          } else if (ehProprioUsuario) {
            selectHTML = `<span class="text-[10px] text-slate-500 italic font-bold">🚫 Autovoto Bloqueado</span>`;
          } else if (jaVotou) {
            selectHTML = `<span class="text-[10px] text-emerald-400 font-bold bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-500/30">✓ Votou</span>`;
          } else {
            selectHTML = `
              <select onchange="atribuirNota(${avaliado.id}, this.value)" class="bg-slate-800 rounded px-2 py-1 text-amber-400 font-bold border border-amber-500/30 focus:ring-0 cursor-pointer">
                <option value="">Votar...</option>
                ${opcoesNotas.map(n => `<option value="${n}">${n.toFixed(1)}</option>`).join('')}
              </select>
